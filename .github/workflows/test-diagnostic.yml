name: Test diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/openrouter-integration
      - run: npm ci --silent
      - name: Migrate provider fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/gateway/gateway.test.ts')
          s = p.read_text()
          s = s.replace(
              "import {\n  MODEL_CONDITION_ID,\n  MODEL_EXPERIMENT_ID,\n  MODEL_EXPERIMENT_VERSION,\n} from '../../src/shared/modelExperiment';",
              "import {\n  EXTERNAL_MARA_PROVIDER_ID,\n  MODEL_CONDITION_ID,\n  MODEL_EXPERIMENT_ID,\n  MODEL_EXPERIMENT_VERSION,\n} from '../../src/shared/modelExperiment';",
          )
          s = s.replace("'openai-mara-action-v1'", 'EXTERNAL_MARA_PROVIDER_ID')
          p.write_text(s)

          p = Path('tests/unit/model-gateway-client.test.ts')
          s = p.read_text()
          anchor = "} from '../../src/shared/decisionContracts';\n"
          addition = """} from '../../src/shared/decisionContracts';
          import {
            EXTERNAL_MARA_PROVIDER_ID,
            MODEL_CONDITION_ID,
            MODEL_EXPERIMENT_ID,
            MODEL_EXPERIMENT_VERSION,
            MODEL_PROMPT_VERSION,
          } from '../../src/shared/modelExperiment';
          """
          if "from '../../src/shared/modelExperiment'" not in s:
              s = s.replace(anchor, addition, 1)
          s = s.replace("experimentId: 'model-backed-npc-001',", 'experimentId: MODEL_EXPERIMENT_ID,')
          s = s.replace("experimentVersion: '1.0.0',", 'experimentVersion: MODEL_EXPERIMENT_VERSION,')
          s = s.replace("conditionId: 'mara-model-per-decision-v1',", 'conditionId: MODEL_CONDITION_ID,')
          s = s.replace("providerId: 'openai-mara-action-v1',", 'providerId: EXTERNAL_MARA_PROVIDER_ID,')
          s = s.replace("promptVersion: 'mara-action-selection-1.0.0',", 'promptVersion: MODEL_PROMPT_VERSION,')
          p.write_text(s)

          p = Path('tests/unit/provider-plan.test.ts')
          s = p.read_text().replace("'openai-mara-action-v1'", 'EXTERNAL_MARA_PROVIDER_ID')
          p.write_text(s)

          p = Path('tests/unit/run-bundle.test.ts')
          s = p.read_text()
          s = s.replace("experimentId: 'model-backed-npc-001',", 'experimentId: MODEL_EXPERIMENT_ID,')
          s = s.replace("experimentVersion: '1.0.0',", 'experimentVersion: MODEL_EXPERIMENT_VERSION,')
          s = s.replace("conditionId: 'mara-model-per-decision-v1',", 'conditionId: MODEL_CONDITION_ID,')
          s = s.replace("providerId: 'openai-mara-action-v1',", 'providerId: EXTERNAL_MARA_PROVIDER_ID,')
          s = s.replace("promptVersion: 'mara-action-selection-1.0.0',", 'promptVersion: MODEL_PROMPT_VERSION,')
          p.write_text(s)
          PY
          npx prettier --write \
            tests/gateway/gateway.test.ts \
            tests/unit/model-gateway-client.test.ts \
            tests/unit/provider-plan.test.ts \
            tests/unit/run-bundle.test.ts
      - name: Commit fixture migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Fixtures already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/gateway/gateway.test.ts \
            tests/unit/model-gateway-client.test.ts \
            tests/unit/provider-plan.test.ts \
            tests/unit/run-bundle.test.ts
          git commit -m "Update tests for OpenRouter experiment identity"
          git push origin HEAD:agent/openrouter-integration
