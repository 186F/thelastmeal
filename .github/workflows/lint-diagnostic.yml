name: Lint diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --silent
      - run: |
          npx prettier --write \
            gateway/adapters/openRouterResponsesAdapter.ts \
            tests/gateway/openrouter-adapter.test.ts \
            tests/gateway/openrouter-config.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            gateway/adapters/openRouterResponsesAdapter.ts
            tests/gateway/openrouter-adapter.test.ts
            tests/gateway/openrouter-config.test.ts
          if-no-files-found: error
