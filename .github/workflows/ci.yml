name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Required checks (clean checkout)
    runs-on: ubuntu-latest
    # 45 minutes: the Phase 3 keyless orchestrator rehearsal drives three
    # complete paced browser runs (~8 minutes) on top of the frozen gates.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck gateway
        run: npm run typecheck:gateway

      - name: Lint
        run: npm run lint

      - name: Validate frozen experiment data
        run: npm run validate

      - name: Unit and integration tests
        run: npm run test:run

      - name: Gateway tests (fake adapter, no secrets)
        run: npm run test:gateway

      - name: Formal model-bundle tests
        run: npm run test:model:bundle

      - name: Production build
        run: npm run build

      - name: Gateway production build
        run: npm run build:gateway

      - name: Build-secret scan (dist)
        run: npm run check:dist

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Deterministic batch (full gate, 100 runs/scenario)
        run: npm run batch

      # After the batch (A10): a failure in the newest step must never
      # pre-empt the frozen 100-run determinism gate.
      - name: Keyless formal model-run rehearsal
        run: npm run model:rehearse -- --ci

      # Affordance and interruption-contract audit with the VS001 known-gap
      # registry (M2 brief §27.6–§27.7): registered gaps report as known
      # limitations; any unregistered finding fails.
      - name: Affordance and interruption-contract audit (known-gap registry)
        run: npm run audit:affordances

      # Phase 3 unattended-orchestrator gates (M2 brief §19), after the
      # audit per the A10 ordering rule. test:m2 is the fast logic suite;
      # m2:rehearse drives the COMPLETE keyless unattended pipeline —
      # Vite + Chromium + fresh fake-gateway children — and self-verifies
      # the §19 properties plus the re-audit's evidence governance: the
      # gateway-stop drill, the verified no-op resume (seals + inventory +
      # manifest + semantic revalidation + archive + receipt),
      # identity-refused resume, the sealed preserved-failure drill with
      # its recorded forbidden disposition, the disposition-refused resume,
      # and derived-output immutability.
      - name: Orchestrator unit and integration tests
        run: npm run test:m2

      - name: Keyless unattended-orchestrator rehearsal
        run: npm run m2:rehearse -- --ci

      # The COMPLETE rehearsal evidence (audit finding 7; re-audit
      # finding 1): the versioned sealed archive, its receipt, the final
      # evidence manifest and reports inside the immutable root, the
      # control-root operational state, and the failure-drill evidence —
      # with a hard failure if any path drifts.
      - name: Upload m2 rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-orchestrator-rehearsal
          path: |
            artifacts/m2-rehearsal/m2-rehearsal-report.json
            artifacts/m2-sequences/m2-orchestrator-rehearsal-evidence-001.zip
            artifacts/m2-sequences/m2-orchestrator-rehearsal-evidence-001.zip.sha256
            artifacts/m2-sequences/m2-orchestrator-rehearsal-evidence-001.zip.receipt.json
            artifacts/m2-sequences/rehearsal/sequence-manifest.json
            artifacts/m2-sequences/rehearsal/sequence-report.json
            artifacts/m2-sequences/rehearsal/sequence-report.md
            artifacts/m2-sequences/rehearsal.control/sequence-state.json
            artifacts/m2-sequences/failure-drill/
            artifacts/m2-sequences/failure-drill.control/sequence-state.json
          if-no-files-found: error

      - name: Upload model-rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-rehearsal-report
          path: |
            artifacts/model-rehearsal/report.json
            artifacts/model-rehearsal/report.md
            artifacts/model-rehearsal/**/run-manifest.final.json
            artifacts/model-rehearsal/**/bundle-manifest.json
            artifacts/model-rehearsal/**/model-summary.json
          # Evidence artifact: a path drift must fail loudly, never upload
          # zero bytes behind a green step (A10 — never `ignore` here).
          if-no-files-found: error

      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-report
          path: |
            artifacts/report.json
            artifacts/report.md
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
