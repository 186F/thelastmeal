name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-evidence:
        description: >-
          Upload the FULL keyless rehearsal evidence (sealed ZIPs and
          Playwright traces) instead of only the routine compact proof
          (Phase 4 audit finding 4). Routine PR/main runs never upload the
          heavy payloads.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Required checks (clean checkout)
    runs-on: ubuntu-latest
    # 55 minutes: the keyless orchestrator rehearsal drives paced browser
    # runs across nine parts, and the Phase 4 remediation adds the real
    # Stage A prerequisite drill sequence to the unit suite.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck gateway
        run: npm run typecheck:gateway

      - name: Lint
        run: npm run lint

      - name: Documentation link check
        run: node scripts/docs/checkLinks.mjs

      - name: Validate frozen experiment data
        run: npm run validate

      # The Chromium binary is needed BEFORE the unit suite: the
      # packaging-recovery drills (focused re-audit finding 3) drive the
      # real orchestrator resume, whose ordinary failing leg launches the
      # real browser. The e2e step later reuses the same install.
      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Unit and integration tests
        run: npm run test:run

      - name: Gateway tests (fake adapter, no secrets)
        run: npm run test:gateway

      - name: Formal model-bundle tests
        run: npm run test:model:bundle

      - name: Production build
        run: npm run build

      - name: Gateway production build
        run: npm run build:gateway

      - name: Build-secret scan (dist)
        run: npm run check:dist

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Deterministic batch (full gate, 100 runs/scenario)
        run: npm run batch

      # After the batch (A10): a failure in the newest step must never
      # pre-empt the frozen 100-run determinism gate.
      - name: Keyless formal model-run rehearsal
        run: npm run model:rehearse -- --ci

      # Affordance and interruption-contract audit with the VS001 known-gap
      # registry (M2 brief §27.6–§27.7): registered gaps report as known
      # limitations; any unregistered finding fails.
      - name: Affordance and interruption-contract audit (known-gap registry)
        run: npm run audit:affordances

      # Phase 3 unattended-orchestrator gates (M2 brief §19), after the
      # audit per the A10 ordering rule. test:m2 is the fast logic suite;
      # m2:rehearse drives the COMPLETE keyless unattended pipeline —
      # Vite + Chromium + fresh fake-gateway children — and self-verifies
      # the §19 properties plus the re-audit's evidence governance: the
      # gateway-stop drill, the verified no-op resume (seals + inventory +
      # manifest + semantic revalidation + archive + receipt),
      # identity-refused resume, the sealed preserved-failure drill with
      # its recorded forbidden disposition, the disposition-refused resume,
      # and derived-output immutability.
      - name: Orchestrator unit and integration tests
        run: npm run test:m2

      - name: Keyless unattended-orchestrator rehearsal
        run: npm run m2:rehearse -- --ci

      # Routine COMPACT artifact profile (Phase 4 audit finding 4): the
      # full rehearsal executed and verified its complete evidence ON THE
      # RUNNER above; routine PR/main uploads carry only compact proof —
      # manifests, reports, control state, inventories, digest sidecars,
      # receipts, trace manifests, failure manifests, verdicts — assembled
      # by an allowlist script that hard-refuses ZIP/trace payloads and
      # enforces the registered <= 50 MiB budget BEFORE upload, emitting a
      # machine-readable artifact-size-report.json.
      - name: Prepare compact rehearsal artifact (size-budget gate)
        if: always()
        run: node scripts/ci/prepareCompactArtifact.mjs

      - name: Upload m2 rehearsal compact proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-rehearsal-compact
          path: artifacts/ci-compact/
          retention-days: 21
          if-no-files-found: error

      # Explicit FULL-EVIDENCE profile: uploads ONLY on a failing run
      # (complete diagnostics) or when a manual workflow_dispatch
      # explicitly requests full evidence (audit-ready or milestone-sealing
      # runs). The prepare step assembles each sequence payload exactly
      # ONCE — sealed ZIP + digest sidecar + receipt for archived sequences
      # (their raw trees are contained in the ZIPs and are excluded), raw
      # trees only for never-archived sequences — under the registered
      # <= 2 GiB full budget, emitting artifact-size-report.json with
      # per-sequence uniqueness dispositions. Formal live evidence is never
      # entrusted to expiring Actions artifacts — it is retained locally as
      # sealed packages with independent durable backup.
      - name: Prepare FULL evidence artifact (uniqueness + size-budget gate)
        if: >-
          failure() ||
          (github.event_name == 'workflow_dispatch' && inputs.full-evidence)
        run: node scripts/ci/prepareCompactArtifact.mjs --profile full

      - name: Upload m2 rehearsal FULL evidence (failure or explicit dispatch only)
        if: >-
          failure() ||
          (github.event_name == 'workflow_dispatch' && inputs.full-evidence)
        uses: actions/upload-artifact@v4
        with:
          name: m2-rehearsal-full-evidence
          path: artifacts/ci-full/
          retention-days: 7
          # The prepare step always writes artifact-size-report.json, so an
          # empty upload here means the profile itself broke — fail loudly.
          if-no-files-found: error

      - name: Upload model-rehearsal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-rehearsal-report
          path: |
            artifacts/model-rehearsal/report.json
            artifacts/model-rehearsal/report.md
            artifacts/model-rehearsal/**/run-manifest.final.json
            artifacts/model-rehearsal/**/bundle-manifest.json
            artifacts/model-rehearsal/**/model-summary.json
          retention-days: 21
          # Evidence artifact: a path drift must fail loudly, never upload
          # zero bytes behind a green step (A10 — never `ignore` here).
          if-no-files-found: error

      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-report
          path: |
            artifacts/report.json
            artifacts/report.md
          retention-days: 21
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
